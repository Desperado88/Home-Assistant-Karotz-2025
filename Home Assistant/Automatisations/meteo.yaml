# Automatisation météo pour Karotz
# Cette automatisation permet de :
# - Adapter la position des oreilles en fonction du risque de pluie (plus le risque est élevé, plus les oreilles sont basses)
# - Modifier la couleur de la LED en fonction de la température (du bleu froid au rouge chaud)
# - Ajuster la vitesse de clignotement selon la force du vent (plus le vent est fort, plus le clignotement est rapide)
# 
# Installation :
# 1. Copier ce code dans la section "automation" du fichier "openkarotz.yaml"
# 2. Remplacer les entités suivantes par celles de votre configuration :
#    - [ville]_rain_chance : capteur de probabilité de pluie
#    - [temperature] : capteur de température
#    - [vitesse du vent] : capteur de vitesse du vent
# 3. Redémarrer Home Assistant

  # Meteo -----------------------------------------------------------
  - id: karotz_dev_meteo_automation
    alias: "karotz_dev - Réaction météo"
    description: "Adapte les oreilles, la LED et le clignotement selon les conditions météo"
    trigger:
      - trigger: time_pattern
        minutes: "15"  # Déclenchement toutes les 15 minutes entre 7h et 19h
    condition:
      - condition: time
        after: "07:00:00"
        before: "19:00:00"
    actions:
      - action: rest_command.karotz_dev_say
        data:
          text: >-
            Voici la météo.
      - action: rest_command.karotz_dev_ears_reset
      - action: input_number.set_value
        data:
          entity_id: input_number.karotz_dev_ear_left
          value: >
            {% set rain = states('sensor.[ville]_rain_chance') | default(0) | float %}
            {% if rain < 5 %}
              {{ 15 }}
            {% elif rain > 60 %}
              {{ 4 }}
            {% else %}
              {{ (15 - ((rain - 5) // 5)) | int }}
            {% endif %}
      - action: input_number.set_value
        data:
          entity_id: input_number.karotz_dev_ear_right
          value: >
            {% set rain = states('sensor.[ville]_rain_chance') | default(0) | float %}
            {% if rain < 5 %}
              {{ 15 }}
            {% elif rain > 60 %}
              {{ 4 }}
            {% else %}
              {{ (15 - ((rain - 5) // 5)) | int }}
            {% endif %}
      - action: input_text.set_value
        data:
          entity_id: input_text.karotz_dev_color_1
          value: >
            {% set temp = states('sensor.[temperature]') | default(20) | float %}
            {% if temp <= -10 %}ADD8E6
            {% elif temp <= -5 %}87CEFA
            {% elif temp <= 0 %}00CED1
            {% elif temp <= 5 %}40E0D0
            {% elif temp <= 10 %}90EE90
            {% elif temp <= 15 %}ADFF2F
            {% elif temp <= 20 %}FFD700
            {% elif temp <= 25 %}FFA500
            {% elif temp <= 30 %}FF4500
            {% else %}FF0000{% endif %}
      - action: input_text.set_value
        data:
          entity_id: input_text.karotz_dev_color_2
          value: "000000"
      - action: input_number.set_value
        data:
          entity_id: input_number.karotz_dev_light_speed
          value: >
            {% set wind = states('sensor.[vitesse du vent]') | default(0) | float %}
            {% set base = 2000 %}
            {% set min_speed = 100 %}
            {% set decrement = ((wind // 5) * 150) %}
            {% set result = base - decrement %}
            {% if result < min_speed %}{{ min_speed }}{% elif result > base %}{{ base }}{% else %}{{ result | int }}{% endif %}
      - action: rest_command.karotz_dev_light
      - action: rest_command.karotz_dev_ears
      - action: rest_command.karotz_dev_say
        data:
          text: >-
            Il fait {{ states('sensor.[temperature]') | default(20) | float | round(0) }} degrés.
            Le vent souffle à {{ states('sensor.[vitesse du vent]') | default(0) | float | round(0) }} kilomètres par heure.
            Le risque de pluie est de {{ states('sensor.[ville]_rain_chance') | default(0) | float | round(0) }} pourcents.
    mode: single  # Empêche le déclenchement multiple simultané
