# Automatisation horloge parlante pour Karotz
# Cette automatisation permet de faire annoncer l'heure toutes les heures
# entre 7h et 20h lorsque le Karotz est en mode éveillé

# Configuration de l'automatisation
# À copier dans la section "automation" du fichier "karotz_dev_base.yaml"

  - id: karotz_dev_horloge_parlante_automation
    alias: "Karotz dev - Annonce de l'heure"
    description: "Fait annoncer l'heure par le Karotz dev toutes les heures"
    trigger:
      - trigger: time_pattern
        minutes: "0"
    condition:
      - condition: time
        after: "07:00:00"
        before: "20:00:00"
      - condition: state
        entity_id: input_boolean.karotz_dev_awake
        state: "on"
    action:
      - action: rest_command.karotz_dev_clock
