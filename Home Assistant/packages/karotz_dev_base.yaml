input_text:
  karotz_dev_ip_address:
    name: Karotz dev IP Address
    initial: "192.168.1.xxx" # ⚠️ À MODIFIER : Remplacer par l'adresse IP de votre Karotz + lignes 63 et 69
  karotz_dev_color_1:
    name: Karotz dev Color 1
    initial: "00ff00" # ⚠️ OPTIONNEL : Couleur par défaut en hexadécimal
  karotz_dev_color_2:
    name: Karotz dev Color 2
    initial: "000000" # ⚠️ OPTIONNEL : Couleur secondaire en hexadécimal
  karotz_dev_tts_text_ha:
    name: Karotz TTS Text
    initial: "Bonjour, je m'appel karotz_dev" # ⚠️ OPTIONNEL : Message par defaut
  # --- Sauvegarde ---
  karotz_dev_saved_color_1:
  karotz_dev_saved_color_2:

sensor:
  - platform: rest
    name: Karotz_dev Status
    resource: "http://192.168.1.xxx/cgi-bin/status" # ⚠️ À MODIFIER : Même IP que karotz_dev_ip_address
    value_template: "{{ value_json.version }}"
    scan_interval: 2592000  # Actualisation tous les mois (30 jours) ou 0 pour actualisation manuelle
    json_attributes:
      - ears_disabled
      - sleep
      - sleep_time
      - led_color
      - led_pulse
      - tts_cache_size
      - usb_free_space
      - karotz_free_space
      - eth_mac
      - wlan_mac
      - nb_tags
      - nb_moods
      - nb_sounds
      - nb_stories
      - karotz_percent_used_space
      - usb_percent_used_space
      - data_dir

input_boolean:
  karotz_dev_awake:
    name: Karotz dev Awake
    initial: true
  karotz_dev_light_fixed_mode:
    name: Karotz dev Light Fixed Mode
    initial: false

input_number:
  karotz_dev_ear_left:
    name: Karotz dev Ear Left
    initial: 0
    min: 0
    max: 16
    step: 1
  karotz_dev_ear_right:
    name: Karotz dev Ear Right
    initial: 0
    min: 0
    max: 16
    step: 1
  karotz_dev_light_speed:
    name: Karotz dev Light Speed
    initial: 700
    min: 0
    max: 2000
    step: 100
  karotz_dev_volume:
    name: Karotz dev Volume
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
    initial: 100
  # -- Sauvegarde ---
  karotz_dev_saved_light_speed:
    min: 0
    max: 2000
    step: 1
  karotz_dev_saved_ear_left:
    min: 0
    max: 16
    step: 1
  karotz_dev_saved_ear_right:
    min: 0
    max: 16
    step: 1

template:
  - sensor:
      - name: "Karotz dev Volume (dB)"
        state: >
          {% set percentage = states('input_number.karotz_dev_volume') | float %}
          {% set db = ((100 - percentage) / 100 * -30) %}
          {{ db | round(0) }}
        unit_of_measurement: "dB"
        icon: mdi:volume-high
  - sensor:
      - name: "karotz_dev_usb_utilisee"
        state: >
            {% set val = state_attr('sensor.karotz_dev_status', 'usb_percent_used_space') %}
            {{ val if val not in [None, ''] else 0 }}
        unit_of_measurement: "%"

rest_command:
  karotz_dev_status:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/status"
  karotz_dev_clear_cache:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/clear_cache"
  karotz_dev_moods:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/apps/moods"
  karotz_dev_moods_id:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/apps/moods?id={{ moods_id }}"
  karotz_dev_wakeup:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/wakeup?silent=1"
  karotz_dev_sleep:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/sleep"
  karotz_dev_ears_random:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/ears_random"
  karotz_dev_ears:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/ears?left={{ states('input_number.karotz_dev_ear_left') }}&right={{ states('input_number.karotz_dev_ear_right') }}&noreset=1"
  karotz_dev_ears_reset:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/ears_reset"
  karotz_dev_light:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/leds?pulse=1&color={{ states('input_text.karotz_dev_color_1') }}&speed={{ states('input_number.karotz_dev_light_speed') }}&color2={{ states('input_text.karotz_dev_color_2') }}"
  karotz_dev_light_fixed:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/leds?pulse=0&color={{ states('input_text.karotz_dev_color_1') }}"
  karotz_dev_say:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/tts?voice=2&text={{ text }}&nocache=1"
    timeout: 60
  karotz_dev_say_ha:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/tts?voice=2&text={{ states('input_text.karotz_dev_tts_text_ha') | urlencode }}&nocache=0"
    timeout: 60
  karotz_dev_sound:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/sound?id={{ sound }}"
  karotz_dev_tai_chi:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/apps/tai-chi"
  karotz_dev_clock:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/apps/clock"
  karotz_dev_volume:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/volume?level={{ states('input_number.karotz_dev_volume') | int }}"
    method: GET
    timeout: 10
  karotz_dev_replay_last_action:
    url: "http://{{ states('input_text.karotz_dev_ip_address') }}/cgi-bin/replay_last_action"

script:
  karotz_dev_wakeup:
    sequence:
      - action: rest_command.karotz_dev_wakeup
  karotz_dev_sleep:
    sequence:
      - action: rest_command.karotz_dev_sleep
  karotz_dev_tai_chi:
    sequence:
      - action: rest_command.karotz_dev_tai_chi
  karotz_dev_moods:
    sequence:
      - action: rest_command.karotz_dev_moods

automation:
  - id: karotz_dev_on_automation
    alias: karotz_dev On
    trigger:
      - trigger: state
        entity_id: sensor.karotz_dev_status
        attribute: sleep
        to: "0"
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.karotz_dev_awake
  - id: karotz_dev_off_automation
    alias: karotz_dev Off
    trigger:
      - trigger: state
        entity_id: sensor.karotz_dev_status
        attribute: sleep
        to: "1"
    action:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.karotz_dev_awake
  - id: karotz_dev_color_automation
    alias: karotz_dev Update Color
    trigger:
      - trigger: state
        entity_id:
          - input_text.karotz_dev_color_1
          - input_text.karotz_dev_color_2
          - input_number.karotz_dev_light_speed
    action:
      - action: rest_command.karotz_dev_light
  - id: karotz_dev_ear_automation
    alias: karotz_dev Update Ears
    trigger:
      - trigger: state
        entity_id:
          - input_number.karotz_dev_ear_left
          - input_number.karotz_dev_ear_right
    action:
      - action: rest_command.karotz_dev_ears
  - id: karotz_dev_light_mode_automation
    alias: karotz_dev Light Mode Automation
    trigger:
      - trigger: state
        entity_id: input_boolean.karotz_dev_light_fixed_mode
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.karotz_dev_light_fixed_mode
                state: "on"
            sequence:
              - action: rest_command.karotz_dev_light_fixed
          - conditions:
              - condition: state
                entity_id: input_boolean.karotz_dev_light_fixed_mode
                state: "off"
            sequence:
              - action: rest_command.karotz_dev_light
  - id: karotz_dev_volume_automation
    alias: karotz_dev Update Volume
    trigger:
      - trigger: state
        entity_id: input_number.karotz_dev_volume
    action:
      - action: rest_command.karotz_dev_volume
        data:
          level: "{{ states('input_number.karotz_dev_volume') | int }}"
  - id: karotz_dev_clear_cache_auto
    alias: "karotz_dev - Clear cache si mémoire > 80%"
    trigger:
      - trigger: numeric_state
        entity_id: sensor.karotz_dev_status
        above: 80
    action:
      - action: rest_command.karotz_dev_clear_cache
