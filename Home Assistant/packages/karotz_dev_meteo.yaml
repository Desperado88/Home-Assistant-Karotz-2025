automation:
  # ----- METEO --------
  - id : karotz_dev - Réaction météo h/30
    alias: karotz_dev - Réaction météo h/30
    description: Adapte les oreilles et les LED à la météo, puis annonce les conditions avec Llama.
    triggers:
      - trigger: time_pattern
        minutes: "30"

    conditions:
      - condition: time
        after: "07:00:00"
        before: "19:00:00"

    actions:
      - action: input_number.set_value
        data:
          entity_id: input_number.karotz_dev_ear_left
          value: >
            {% set rain = states('sensor.treillieres_rain_chance') | float(0) %}
            {% if rain < 5 %}
              15
            {% elif rain > 60 %}
              4
            {% else %}
              {{ (15 - ((rain - 5) // 5)) | int }}
            {% endif %}

      - action: input_number.set_value
        data:
          entity_id: input_number.karotz_dev_ear_right
          value: >
            {% set rain = states('sensor.treillieres_rain_chance') | float(0) %}
            {% if rain < 5 %}
              15
            {% elif rain > 60 %}
              4
            {% else %}
              {{ (15 - ((rain - 5) // 5)) | int }}
            {% endif %}

      - action: input_text.set_value
        data:
          entity_id: input_text.karotz_dev_color_1
          value: >
            {% set temp = states('sensor.pac_atom_temp_ext') | float(20) %}
            {% if temp <= -10 %}ADD8E6
            {% elif temp <= -5 %}87CEFA
            {% elif temp <= 0 %}00CED1
            {% elif temp <= 5 %}40E0D0
            {% elif temp <= 10 %}90EE90
            {% elif temp <= 15 %}ADFF2F
            {% elif temp <= 20 %}FFD700
            {% elif temp <= 25 %}FFA500
            {% elif temp <= 30 %}FF4500
            {% else %}FF0000
            {% endif %}

      - action: input_text.set_value
        data:
          entity_id: input_text.karotz_dev_color_2
          value: "000000"

      - action: input_number.set_value
        data:
          entity_id: input_number.karotz_dev_light_speed
          value: >
            {% set wind = states('sensor.weather_station_vitesse_moyenne_du_vent_km_h') | float(0) %}
            {% set result = 2000 - ((wind // 5) * 150) %}
            {% if result < 100 %}
              100
            {% else %}
              {{ [result, 2000] | min | int }}
            {% endif %}

      - action: rest_command.karotz_dev_light
        data: {}

      - action: rest_command.karotz_dev_ears
        data: {}

      - action: conversation.process
        data:
          agent_id: conversation.llama3_1
          text: >-
            Tu es Karotz, un petit lapin robot drôle, chaleureux et attachant.
            Tu annonces la météo à la personne qui habite dans la maison.

            Voici les mesures actuelles fournies par Home Assistant :
            - Température extérieure : {{ states('sensor.pac_atom_temp_ext') }} °C
            - Vitesse moyenne du vent : {{ states('sensor.weather_station_vitesse_moyenne_du_vent_km_h') }} km/h
            - Probabilité de pluie : {{ states('sensor.treillieres_rain_chance') }} %
            - Alerte météo : {{ states('sensor.44_weather_alert') }}

            Compose une annonce orale naturelle en français, en une ou deux
            phrases, de 25 à 45 mots maximum.
            Parle comme un compagnon qui donne un conseil utile avant de sortir.
            Interprète les mesures disponibles : indique si le vent est faible,
            modéré ou fort, si le risque de pluie est faible, modéré ou élevé,
            et adapte ton conseil vestimentaire à la température.
            Si une alerte météo orange ou rouge est indiquée, mentionne-la
            clairement et donne un conseil de prudence.
            Ne confonds pas probabilité de pluie et prévision horaire :
            n'affirme pas qu'il ne pleuvra pas dans les prochaines heures,
            car aucune prévision horaire n'est fournie ici.
            N'invente aucune mesure, prévision ou alerte.
            Si une mesure est indisponible, ignore-la.
            Évite de réciter simplement les chiffres : transforme-les en
            une phrase fluide, vivante et parfois légèrement amusante.
        response_variable: llm_response

      - action: rest_command.karotz_dev_say
        data:
          text: >-
            {{ llm_response.get('response', {}).get('speech', {}).get('plain', {}).get('speech', '')
              or "La météo est un peu mystérieuse aujourd'hui. Vérifie les conditions avant de sortir !" }}

    mode: single

  # Annonce la météo du jour
  - id: karotz_dev_meteo_jour
    alias: karotz_dev - Météo du jour 7h15
    description: Annonce les prévisions du jour avec Llama et adapte les animations de Karotz.
    triggers:
      - trigger: time
        at: "07:15:00"

    conditions: []

    actions:
      # Oreille gauche selon le risque de pluie
      - action: input_number.set_value
        data:
          entity_id: input_number.karotz_dev_ear_left
          value: >
            {% set pluie = state_attr('sensor.prevision_meteo_aujourd_hui', 'precipitation_probability') %}
            {% set pluie = pluie | float(0) if pluie not in [none, 'unavailable', 'unknown', '', 'n/a'] else 0 %}
            {% if pluie < 5 %}
              15
            {% elif pluie > 60 %}
              4
            {% else %}
              {{ (15 - ((pluie - 5) // 5)) | int }}
            {% endif %}

      # Oreille droite selon le risque de pluie
      - action: input_number.set_value
        data:
          entity_id: input_number.karotz_dev_ear_right
          value: >
            {% set pluie = state_attr('sensor.prevision_meteo_aujourd_hui', 'precipitation_probability') %}
            {% set pluie = pluie | float(0) if pluie not in [none, 'unavailable', 'unknown', '', 'n/a'] else 0 %}
            {% if pluie < 5 %}
              15
            {% elif pluie > 60 %}
              4
            {% else %}
              {{ (15 - ((pluie - 5) // 5)) | int }}
            {% endif %}

      # Couleur de la LED selon la température maximale
      - action: input_text.set_value
        data:
          entity_id: input_text.karotz_dev_color_1
          value: >
            {% set temp = state_attr('sensor.prevision_meteo_aujourd_hui', 'temperature') %}
            {% set temp = temp | float(20) if temp not in [none, 'unavailable', 'unknown', '', 'n/a'] else 20 %}
            {% if temp <= -10 %}ADD8E6
            {% elif temp <= -5 %}87CEFA
            {% elif temp <= 0 %}00CED1
            {% elif temp <= 5 %}40E0D0
            {% elif temp <= 10 %}90EE90
            {% elif temp <= 15 %}ADFF2F
            {% elif temp <= 20 %}FFD700
            {% elif temp <= 25 %}FFA500
            {% elif temp <= 30 %}FF4500
            {% else %}FF0000
            {% endif %}

      # Couleur secondaire éteinte
      - action: input_text.set_value
        data:
          entity_id: input_text.karotz_dev_color_2
          value: "000000"

      # Vitesse de clignotement selon le vent
      - action: input_number.set_value
        data:
          entity_id: input_number.karotz_dev_light_speed
          value: >
            {% set wind = state_attr('sensor.prevision_meteo_aujourd_hui', 'wind_speed') %}
            {% set wind = wind | float(0) if wind not in [none, 'unavailable', 'unknown', '', 'n/a'] else 0 %}
            {% set result = 2000 - ((wind // 5) * 150) %}
            {{ [[result, 100] | max, 2000] | min | int }}

      # Appliquer les réglages de Karotz
      - action: rest_command.karotz_dev_light
        data: {}

      - action: rest_command.karotz_dev_ears
        data: {}

      # Générer une annonce météo naturelle avec Llama
      - action: conversation.process
        data:
          agent_id: conversation.llama3_1
          text: >-
            Tu es Karotz, un petit lapin robot drôle, chaleureux et attachant.
            Tu annonces la météo du jour à la personne qui habite dans la maison.

            Voici les prévisions disponibles :
            Conditions : {{ {
              'sunny': 'ensoleillé',
              'clear-night': 'nuit dégagée',
              'cloudy': 'nuageux',
              'partlycloudy': 'partiellement nuageux',
              'fog': 'brouillard',
              'windy': 'venteux',
              'windy-variant': 'vent variable',
              'hail': 'grêle',
              'lightning': 'orages',
              'lightning-rainy': 'orages et pluie',
              'pouring': 'fortes pluies',
              'rainy': 'pluvieux',
              'snowy': 'neige',
              'snowy-rainy': 'neige et pluie',
              'exceptional': 'conditions exceptionnelles'
            }.get(states('sensor.prevision_meteo_aujourd_hui'), states('sensor.prevision_meteo_aujourd_hui')) }}
            Température minimale : {{ state_attr('sensor.prevision_meteo_aujourd_hui', 'templow') if state_attr('sensor.prevision_meteo_aujourd_hui', 'templow') not in [none, 'unavailable', 'unknown', '', 'n/a'] else 'indisponible' }} °C.
            Température maximale : {{ state_attr('sensor.prevision_meteo_aujourd_hui', 'temperature') if state_attr('sensor.prevision_meteo_aujourd_hui', 'temperature') not in [none, 'unavailable', 'unknown', '', 'n/a'] else 'indisponible' }} °C.
            Probabilité de pluie : {{ state_attr('sensor.prevision_meteo_aujourd_hui', 'precipitation_probability') if state_attr('sensor.prevision_meteo_aujourd_hui', 'precipitation_probability') not in [none, 'unavailable', 'unknown', '', 'n/a'] else 'indisponible' }} %.
            Couverture nuageuse : {{ state_attr('sensor.prevision_meteo_aujourd_hui', 'cloud_coverage') if state_attr('sensor.prevision_meteo_aujourd_hui', 'cloud_coverage') not in [none, 'unavailable', 'unknown', '', 'n/a'] else 'indisponible' }} %.
            Vent : {{ state_attr('sensor.prevision_meteo_aujourd_hui', 'wind_speed') if state_attr('sensor.prevision_meteo_aujourd_hui', 'wind_speed') not in [none, 'unavailable', 'unknown', '', 'n/a'] else 'indisponible' }} km/h.
            Indice UV : {{ state_attr('sensor.prevision_meteo_aujourd_hui', 'uv_index') if state_attr('sensor.prevision_meteo_aujourd_hui', 'uv_index') not in [none, 'unavailable', 'unknown', '', 'n/a'] else 'indisponible' }}.

            Formule une annonce orale naturelle en français de deux ou trois phrases,
            entre 30 et 50 mots maximum.
            Commence par une formule variée, pas toujours par « Voici la météo ».
            Résume les conditions, les températures, le vent et le risque de pluie.
            Donne un conseil concret sur les vêtements ou le parapluie si les données
            le justifient. Si l'indice UV est élevé, conseille de se protéger du soleil.
            Tu peux ajouter une petite plaisanterie de lapin.
            Ne récite pas simplement une liste de chiffres.
            N'invente aucune donnée ni prévision horaire.
            Ignore les mesures indisponibles.
        response_variable: llm_response

      # Faire parler Karotz avec la réponse de Llama
      - action: rest_command.karotz_dev_say
        data:
          text: >-
            {{ llm_response.get('response', {}).get('speech', {}).get('plain', {}).get('speech', '')
              or "Bonjour ! Pense à vérifier la météo avant de sortir et à choisir une tenue adaptée." }}

    mode: single

  # Annonce de la meteo du lendemain à 19h
  - id: karotz_dev_meteo_demain
    alias: karotz_dev - Météo de demain à 19h05
    description: Annonce les prévisions du lendemain avec une phrase naturelle générée par Llama.
    triggers:
      - trigger: time
        at: "19:05:00"

    conditions: []

    actions:
      - action: conversation.process
        data:
          agent_id: conversation.llama3_1
          text: >-
            Tu es Karotz, un petit lapin robot drôle, chaleureux et attachant.
            Il est environ 19 heures et tu présentes la météo de demain.

            Voici les prévisions disponibles :
            Conditions : {{ {
              'sunny': 'ensoleillé',
              'clear-night': 'nuit dégagée',
              'cloudy': 'nuageux',
              'partlycloudy': 'partiellement nuageux',
              'fog': 'brouillard',
              'windy': 'venteux',
              'windy-variant': 'vent variable',
              'hail': 'grêle',
              'lightning': 'orages',
              'lightning-rainy': 'orages et pluie',
              'pouring': 'fortes pluies',
              'rainy': 'pluvieux',
              'snowy': 'neige',
              'snowy-rainy': 'neige et pluie',
              'exceptional': 'conditions exceptionnelles'
            }.get(states('sensor.prevision_meteo_demain'), states('sensor.prevision_meteo_demain')) }}
            Température minimale : {{ state_attr('sensor.prevision_meteo_demain', 'templow') if state_attr('sensor.prevision_meteo_demain', 'templow') not in [none, 'unavailable', 'unknown', '', 'n/a'] else 'indisponible' }} °C.
            Température maximale : {{ state_attr('sensor.prevision_meteo_demain', 'temperature') if state_attr('sensor.prevision_meteo_demain', 'temperature') not in [none, 'unavailable', 'unknown', '', 'n/a'] else 'indisponible' }} °C.
            Probabilité de pluie : {{ state_attr('sensor.prevision_meteo_demain', 'precipitation_probability') if state_attr('sensor.prevision_meteo_demain', 'precipitation_probability') not in [none, 'unavailable', 'unknown', '', 'n/a'] else 'indisponible' }} %.
            Couverture nuageuse : {{ state_attr('sensor.prevision_meteo_demain', 'cloud_coverage') if state_attr('sensor.prevision_meteo_demain', 'cloud_coverage') not in [none, 'unavailable', 'unknown', '', 'n/a'] else 'indisponible' }} %.
            Vent : {{ state_attr('sensor.prevision_meteo_demain', 'wind_speed') if state_attr('sensor.prevision_meteo_demain', 'wind_speed') not in [none, 'unavailable', 'unknown', '', 'n/a'] else 'indisponible' }} km/h.
            Indice UV : {{ state_attr('sensor.prevision_meteo_demain', 'uv_index') if state_attr('sensor.prevision_meteo_demain', 'uv_index') not in [none, 'unavailable', 'unknown', '', 'n/a'] else 'indisponible' }}.

            Fais une annonce orale en français de deux ou trois phrases,
            entre 30 et 50 mots maximum.
            Présente les grandes tendances de demain, les températures et le risque
            de pluie. Donne un conseil utile pour préparer la journée du lendemain :
            vêtements chauds, veste, parapluie ou protection solaire selon les données.
            Tu peux terminer par une remarque amusante et affectueuse.
            Varie les formulations et évite de réciter une liste de chiffres.
            N'invente aucune donnée, aucune alerte et aucune prévision horaire.
            Si une valeur est indisponible, ignore-la.
        response_variable: llm_response

      - action: rest_command.karotz_dev_say
        data:
          text: >-
            {{ llm_response.get('response', {}).get('speech', {}).get('plain', {}).get('speech', '')
              or "Pour demain, pense à vérifier les prévisions avant de partir. Bonne soirée !" }}

    mode: single