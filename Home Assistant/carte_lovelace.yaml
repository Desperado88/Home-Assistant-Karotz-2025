# carte lovelace pour la gestion des tags RFID
# Remarques :
# Le dernier bloc utilise custom:auto-entities et custom:multiple-entity-row, donc assure-toi d’avoir installé ces deux cartes personnalisées via HACS :
# auto-entities : https://github.com/thomasloven/lovelace-auto-entities
# multiple-entity-row : https://github.com/benct/lovelace-multiple-entity-row

type: vertical-stack
cards:
  - type: entities
    title: Karotz RFID
    show_header_toggle: false
    entities:
      - entity: input_boolean.karotz_bleu_mode_enregistrement_tag
        name: Mode Enregistrement
        icon: mdi:rfid
  - type: grid
    columns: 3
    square: false
    cards:
      - type: button
        name: ▶️ Enregistrer
        tap_action:
          action: call-service
          service: input_boolean.turn_on
          target:
            entity_id: input_boolean.karotz_bleu_mode_enregistrement_tag
      - type: button
        name: ⏹️ Stop
        tap_action:
          action: call-service
          service: input_boolean.turn_off
          target:
            entity_id: input_boolean.karotz_bleu_mode_enregistrement_tag
      - type: button
        name: 🔄 Rafraîchir
        tap_action:
          action: call-service
          service: rest_command.karotz_bleu_rfid_list_ext
  - type: entities
    show_header_toggle: false
    entities:
      - entity: input_text.karotz_bleu_rfid_id
        name: ID
      - entity: input_text.karotz_bleu_rfid_name
        name: Nom
      - entity: input_text.karotz_bleu_rfid_url
        name: URL
  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        name: ✅ Assigner
        tap_action:
          action: call-service
          service: rest_command.karotz_bleu_rfid_assign
      - type: button
        name: 🗑️ Supprimer
        tap_action:
          action: call-service
          service: rest_command.karotz_bleu_rfid_delete
          data:
            tag_id: "{{ states('input_text.karotz_bleu_rfid_id') }}"

