# === Controle de la lecture des histoires ===
type: vertical-stack
cards:
  - type: entities
    entities:
      - entity: input_select.karotz_dev_story
        name: Choisis une histoire
  - show_name: true
    show_icon: true
    type: button
    name: 📚 Lire l'histoire sélectionnée 📖
    tap_action:
      action: call-service
      service: script.karotz_dev_play_story
  - type: horizontal-stack
    cards:
      - show_name: true
        show_icon: true
        type: button
        name: Lecture USB ▶️
        icon: ""
        tap_action:
          action: call-service
          service: rest_command.karotz_dev_play_usb
      - show_name: true
        show_icon: true
        type: button
        name: Pause ⏸️
        icon: ""
        tap_action:
          action: call-service
          service: rest_command.karotz_dev_pause_usb
      - show_name: true
        show_icon: true
        type: button
        name: Stop ⏹️
        icon: ""
        tap_action:
          action: call-service
          service: rest_command.karotz_dev_stop_usb
