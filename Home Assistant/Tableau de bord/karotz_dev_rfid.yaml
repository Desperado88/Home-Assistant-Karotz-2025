type: vertical-stack
cards:
  - type: entities
    title: RFID - Configuration
    show_header_toggle: false
    entities:
      - entity: input_text.karotz_dev_rfid_id
        name: ID du tag
        show_icon: false
      - entity: input_text.karotz_dev_rfid_name
        name: Nom du tag
        show_icon: false
      - entity: input_text.karotz_dev_rfid_url
        name: URL Webhook
        show_icon: false
      - type: button
        name: Assigner le Tag
        show_icon: false
        tap_action:
          action: call-service
          service: rest_command.karotz_dev_rfid_assign
  - type: entities
    title: RFID - Actions
    show_header_toggle: false
    entities:
      - type: button
        name: Démarrer l'enregistrement
        show_icon: false
        tap_action:
          action: call-service
          service: rest_command.karotz_dev_rfid_record_start
      - type: button
        name: Arrêter l'enregistrement
        show_icon: false
        tap_action:
          action: call-service
          service: rest_command.karotz_dev_rfid_record_stop
      - type: button
        name: Rafraîchir la liste
        show_icon: false
        tap_action:
          action: call-service
          service: homeassistant.update_entity
          data:
            entity_id: sensor.karotz_dev_rfid_list
  - type: markdown
    title: Liste des Tags RFID
    content: >
      <table> <tbody> {% set
      tags = state_attr('sensor.karotz_dev_rfid_list', 'tags') %} {% if tags %}
        {% for tag in tags %}
          ID: {{ tag.id }} {{ tag.name if tag.name else 'Sans nom' }}
        {% endfor %}
      {% else %}
        Aucun tag trouvé
      {% endif %} </tbody> </table>
  - type: entities
    title: RFID - Supprimer
    show_header_toggle: false
    entities:
      - entity: input_text.karotz_dev_rfid_delete_id
        name: ID du tag à supprimer
        show_icon: false
      - type: button
        name: Supprimer le tag
        show_icon: false
        tap_action:
          action: call-service
          service: rest_command.karotz_dev_rfid_delete
